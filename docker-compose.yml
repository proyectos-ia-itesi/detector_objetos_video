name: detector-objetos-video

# Orquestación principal del proyecto.
#   frontend -> Apache (HTML/JS). Sirve la web y hace proxy de /api/ al backend.
#   backend  -> PHP 8.3 + Apache. services.php elige la función con ?servicio=...
#   motor    -> Python + FastAPI. Motor de IA (detección de objetos).
#
# Uso:  docker compose up --build
# Web:  http://localhost:8080

services:
  frontend:
    build: ./frontend
    container_name: dov-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dov-backend
    environment:
      MOTOR_URL: http://motor:8000
    depends_on:
      motor:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  db:
    build: ./db
    container_name: dov-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_dev
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net
    restart: unless-stopped

  motor:
    build: ./motor
    container_name: dov-motor
    environment:
      MODEL_PATH: /app/models/modelo.pt   # pesos propios (opcional)
      MODEL_NAME: yolo26x.pt              # preentrenado si no hay pesos propios (el más grande de YOLO26)
      CONF_MINIMA: "0.25"
      IMGSZ: "640"
    volumes:
      - ./motor/models:/app/models        # pesos y caché de modelos (no se versionan)
    ports:
      - "127.0.0.1:8000:8000"             # solo local, para probar el motor directamente
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:

networks:
  app-net:
    driver: bridge
